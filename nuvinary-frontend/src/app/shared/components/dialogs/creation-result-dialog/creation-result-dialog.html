<div class="relative max-w-lg mx-2.5 xs:mx-0">
  <div
    class="absolute -inset-10 -z-10 rounded-[3rem] bg-linear-to-br from-primary to-accent opacity-60 blur-3xl"
    aria-hidden="true"
  ></div>

  <div
    class="flex flex-col gap-6 p-8 rounded-3xl shadow-2xl bg-result animate-in zoom-in-95 duration-300 w-full"
  >
    <p class="font-bold text-sm text-center md:text-base text-white/70 uppercase tracking-widest">
      {{ introLine }}
    </p>

    <h2 class="font-black text-xl text-center md:text-3xl text-white/90 tracking-tight">
      {{ creation.title }}
    </h2>

    <img
      [src]="creation.url"
      [alt]="creation.title"
      class="w-full rounded-2xl shadow-lg object-cover"
    />

    <span
      class="my-4 font-bold text-sm text-center md:text-base text-white/70 uppercase tracking-widest"
      >{{ outroLine }}</span
    >
  </div>
</div>
