<div
  class="relative flex flex-col gap-6 p-8 rounded-3xl border border-border-light bg-white shadow-2xl animate-in zoom-in-95 duration-300 max-w-lg mx-2.5 xs:mx-0"
>
  <button
    (click)="onClose()"
    class="absolute right-5 top-5 p-1.5 rounded-full border border-border-gentle bg-white-strong shadow-sm backdrop-blur-md transition-colors hover:bg-bg-light"
  >
    <lucide-icon [img]="icons.closeIcon" class="w-4 h-4"></lucide-icon>
  </button>

  <h1 class="font-black text-xl md:text-2xl text-text-strong tracking-tight pr-8">
    {{ creation.title }}
  </h1>

  <img
    [src]="creation.url"
    [alt]="creation.title"
    class="w-full rounded-2xl shadow-lg object-cover"
  />
</div>
